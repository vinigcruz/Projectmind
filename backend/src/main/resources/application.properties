spring.application.name=backend
server.port=8080

# Configuração do Banco de Dados PostgreSQL (Neon.tech Pooler com prepareThreshold=0)
spring.datasource.url=jdbc:postgresql://ep-fragrant-tree-b6jq9q92-pooler.c-2.sa-east-1.aws.neon.tech/neondb?sslmode=require&prepareThreshold=0
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=neondb_owner
spring.datasource.password=npg_yil7Q3XNAxJO

# Resiliência de Pool HikariCP para banco Serverless (Neon.tech)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.max-lifetime=240000
spring.datasource.hikari.idle-timeout=120000
spring.datasource.hikari.keepalive-time=60000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.validation-timeout=5000

# Configuração Hibernate JPA para PostgreSQL
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

