<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QR Code Oficial — Apresentação TCC ProjectMind</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Inter, system-ui, sans-serif; }
      body {
        min-height: 100vh;
        background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #1e3a8a 100%);
        color: #fff;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      .card {
        background: #ffffff;
        color: #0f172a;
        border-radius: 28px;
        padding: 36px 40px;
        max-width: 460px;
        width: 100%;
        text-align: center;
        box-shadow: 0 25px 60px rgba(0, 0, 0, 0.45);
      }
      h1 { font-size: 26px; font-weight: 800; color: #0f172a; margin-bottom: 6px; }
      p.sub { font-size: 13.5px; color: #64748b; margin-bottom: 22px; line-height: 1.45; }
      .qr-box {
        background: #ffffff;
        border: 3px solid #dbeafe;
        border-radius: 22px;
        padding: 16px;
        display: inline-block;
        margin-bottom: 18px;
      }
      .qr-box img { width: 280px; height: 280px; display: block; }
      .url-input-group {
        display: flex;
        gap: 8px;
      }
      .url-input-group input {
        flex: 1;
        padding: 10px 12px;
        border: 1px solid #cbd5e1;
        border-radius: 10px;
        font-size: 12.5px;
        font-family: monospace;
        color: #1e293b;
      }
      .btn {
        background: #2563eb;
        color: #ffffff;
        border: none;
        border-radius: 10px;
        padding: 10px 16px;
        font-size: 12.5px;
        font-weight: 700;
        cursor: pointer;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }
      .btn:hover { background: #1d4ed8; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>ProjectMind IA</h1>
      <p class="sub">
        Aponte a câmera do seu celular para acessar a plataforma em tempo real:
      </p>

      <div class="qr-box">
        <img
          id="qrImg"
          src="https://api.qrserver.com/v1/create-qr-code/?size=500x500&margin=12&color=0f172a&bgcolor=ffffff&data=https%3A%2F%2Fprojectmind-frontend.onrender.com"
          alt="QR Code ProjectMind"
        />
      </div>

      <div class="url-input-group">
        <input
          id="urlInput"
          type="text"
          value="https://projectmind-frontend.onrender.com"
          placeholder="Cole aqui a URL do seu Frontend no Render"
        />
        <button class="btn" onclick="atualizarQr()">Atualizar QR</button>
      </div>
    </div>

    <script>
      function atualizarQr() {
        const url = document.getElementById("urlInput").value.trim() || "https://projectmind-frontend.onrender.com";
        document.getElementById("qrImg").src =
          "https://api.qrserver.com/v1/create-qr-code/?size=500x500&margin=12&color=0f172a&bgcolor=ffffff&data=" +
          encodeURIComponent(url);
      }
    </script>
  </body>
</html>
