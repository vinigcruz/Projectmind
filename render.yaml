services:
  # 1. Backend Java 21 (Spring Boot + Docker)
  - type: web
    name: projectmind-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/projetos/ping
    envVars:
      - key: PORT
        value: 8080

  # 2. Frontend React (Vite Static Site - Gratuito e Ilimitado)
  - type: web
    name: projectmind-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: projectmind-backend
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

