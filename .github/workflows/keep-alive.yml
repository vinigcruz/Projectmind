name: Keep Backend Awake (0s Cold Start)

on:
  schedule:
    # Dispara automaticamente a cada 5 minutos na nuvem do GitHub (mesmo com seu PC desligado)
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Ping ProjectMind Java Container & Neon DB
        run: |
          curl -s -o /dev/null -w "Status HTTP: %{http_code} | Tempo: %{time_total}s\n" https://projectmind-theta.vercel.app/api/projetos/ping

