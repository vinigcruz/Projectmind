name: Keep Backend Awake (0s Cold Start)

on:
  schedule:
    # Dispara automaticamente a cada 10 minutos para evitar hibernação de 15 min do Render
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Ping ProjectMind Java Container & Neon DB
        env:
          BACKEND_URL: ${{ vars.RENDER_BACKEND_URL || 'https://projectmind-backend.onrender.com' }}
        run: |
          curl -s -o /dev/null -w "Status HTTP: %{http_code} | Tempo: %{time_total}s\n" "${BACKEND_URL}/api/projetos/ping"
